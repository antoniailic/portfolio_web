<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antonia Ilic Bromberg — Editorial &amp; brand designer</title>
  <meta name="description" content="Antonia Ilic Bromberg — editorial and brand designer based in Barcelona, working across Europe.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/case.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #000; }
    .home-stage { position: fixed; inset: 0; color: #fff; }
    .banners img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s ease; }
    .banners img.on { opacity: 1; }
    .veil { position: absolute; top: 0; bottom: 0; left: 0; width: 760px; max-width: 70%; background: linear-gradient(to right, rgba(0,0,0,.45), rgba(0,0,0,0)); pointer-events: none; }
    .index-wrap { position: absolute; left: 0; right: 0; top: 81px; z-index: 5; pointer-events: none; }
    /* categoría y proyecto juntos: la columna de categorías mide lo que la más larga, y 12 px hasta el nombre */
    .index { --c: 1 / 9; display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 12px; row-gap: 3px; pointer-events: auto; }
    .index a { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; }
    .index .cat { grid-column: 1; color: rgba(255,255,255,.3); }
    .index .ttl { grid-column: 2; color: rgba(255,255,255,.55); }
    .index a.on .cat { color: rgba(255,255,255,.5); }
    .index a.on .ttl, .index a:hover .ttl { color: #fff; }
    .foot { position: absolute; left: 0; right: 0; bottom: 12px; pointer-events: none; color: #fff; }
    .foot p:first-child { --c: 1 / 7; } .foot p:last-child { --c: 7 / 13; text-align: right; }
    .index .dot { display: none; }
    @media (max-width: 768px) {
      /* Mobile: categoría junto al nombre y un círculo que marca el proyecto en pantalla */
      .index { --m: 1 / -1; display: flex; flex-direction: column; row-gap: 6px; position: relative; padding-left: 16px; }
      .index a { display: flex; gap: 8px; align-items: baseline; }
      .index .cat { flex: none; }
      .index .ttl { min-width: 0; }
      .index .dot { display: block; position: absolute; left: 0; top: 0; width: 7px; height: 7px; border-radius: 50%; background: #fff;
        transition: transform .45s cubic-bezier(.65, 0, .35, 1); pointer-events: none; }
      .foot p:first-child, .foot p:last-child { --m: 1 / -1; text-align: left; }
    }
  </style>
</head>
<body class="home">
  <main class="home-stage">
    <div class="banners"></div>
    <div class="veil"></div>
    <nav class="case-nav g" aria-label="Main">
      <a class="hand portfolio" href="index.html" aria-label="Portfolio"></a>
      <a class="name" href="index.html">Antonia Ilic Bromberg</a>
      <span class="links"><a class="hand about" href="about.html" aria-label="About"></a><a class="hand contact" href="contact.html" aria-label="Contact"></a></span>
    </nav>
    <div class="index-wrap g"><nav class="index" aria-label="Projects"></nav></div>
    <div class="foot g"><p>Based in Barcelona · Working across Europe</p><p>Editorial &amp; brand designer</p></div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
